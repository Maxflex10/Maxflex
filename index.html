<!DOCTYPE html>
<html lang="fr">
<head>

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #0e0e0e;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;

    }

      color: #bbbbbb;

      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2em;
    }

    .link {
      background: #f5f5f5;
      color: #0e0e0e;
      padding: 12px 24px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }

    .link:hover {
      background: #e91e63;
      color: white;
    }

    footer {

      font-size: 0.9em;
      color: #888;
